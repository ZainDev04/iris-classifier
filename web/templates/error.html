<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>{{ code }} · Iris Species Classifier</title>
<link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
<body class="error-page">
<main class="error-main">
  <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Error {{ code }}</p>
  <h1 class="hero-title glitch" data-text="{{ code }}">{{ code }}</h1>
  <p class="lede">{{ message }}</p>
  <a class="btn btn-primary" href="/">Back to the classifier</a>
</main>
</body>
</html>
